[package]
name = "keymaster-avatar"
version = "0.2.0"
edition = "2021"
description = "KeyMaster Avatar - Nostr-based key service relay agent"

[[bin]]
name = "keymaster-avatar"
path = "src/main.rs"

[dependencies]
avatar-protocol = { path = "../avatar-protocol" }

# Nostr protocol
nostr = { version = "0.37", features = ["std", "nip44"] }
nostr-sdk = "0.37"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { workspace = true }

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# QR code display in terminal
qrcode = "0.14"

# Base64 encoding
base64 = "0.22"

# BIP-32 key derivation (already in dep tree via nostr)
bitcoin = { version = "0.32", features = ["std"] }

# Cryptographic random seed generation
getrandom = "0.2"

# Unix user resolution
nix = { version = "0.29", features = ["user", "fs"] }

# Error handling
anyhow = "1"
