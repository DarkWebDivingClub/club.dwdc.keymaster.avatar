[package]
name = "km-nostr-sa"
version = "0.4.0"
edition = "2021"
description = "Nostr Service Avatar - JSON-RPC to Avatar local API bridge"

[[bin]]
name = "km-nostr-sa"
path = "src/main.rs"

[dependencies]
avatar-protocol = { path = "../avatar-protocol" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Base64 encoding
base64 = "0.22"

# Hex encoding
hex = "0.4"

# Error handling
anyhow = "1"
