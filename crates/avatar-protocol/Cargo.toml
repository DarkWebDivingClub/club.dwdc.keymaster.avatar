[package]
name = "avatar-protocol"
version = "0.1.0"
edition = "2021"
description = "Shared local API types for Avatar ↔ service avatar communication"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "net"] }
anyhow = "1"
sha2 = "0.10"
